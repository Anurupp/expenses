<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>Dhritimaan & Tushali — Wedding Manager</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
:root{--bg:#ffffff;--card:#f7f6f3;--ink:#222222;--gold:#a98532;--sage:#3f7f55;--red:#b3402f;--line:#e7e4dc;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}

*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 Georgia,serif}
main{max-width:980px;margin:auto;padding:16px}h1{font-weight:400;margin:0}h1 small{display:block;font-size:13px;color:var(--gold);letter-spacing:.08em}
nav{display:flex;gap:6px;margin:14px 0;flex-wrap:wrap}button,input,select{font:inherit;color:inherit}
button{background:var(--card);border:1px solid var(--gold);border-radius:20px;padding:10px 16px;cursor:pointer;min-height:44px}
button.on,button.p{background:var(--gold);color:#fff}.card{background:var(--card);border-radius:14px;padding:14px;margin:10px 0;box-shadow:0 2px 8px #0001;animation:f .3s}
@keyframes f{from{opacity:0;transform:translateY(6px)}}@media(prefers-reduced-motion:reduce){.card{animation:none}}
.g{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}.n{font-size:22px}.l{font-size:12px;opacity:.7}
.bar{height:8px;background:var(--line);border-radius:4px;overflow:hidden}.bar i{display:block;height:100%;background:var(--sage)}
.t{font-size:12px;padding:2px 8px;border-radius:10px;border:1px solid currentColor}.ok{color:var(--sage)}.bad{color:var(--red)}.w{color:var(--gold)}
input,select{padding:10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);width:100%;margin:4px 0}
.r{overflow-x:auto}table{border-collapse:collapse;width:100%;font-size:14px}td,th{padding:6px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
.note{font-size:13px;border-left:3px solid var(--gold);padding-left:10px}.card{border:1px solid var(--line)}.pay .top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}.acts{margin-top:8px;display:flex;gap:6px;flex-wrap:wrap;align-items:center}.acts a{color:var(--gold);border:1px solid var(--gold);border-radius:20px;padding:8px 14px;text-decoration:none;min-height:40px}
@media print{nav,button,form,.np{display:none}}
</style></head><body><main>
<h1>Dhritimaan & Tushali — Wedding Manager<small>WEDDING EXPENSES, PAYMENTS & VENDOR MANAGEMENT · DEMO MODE</small></h1>
<nav id="nav"></nav><div id="v"></div>
<p class="note np">Demo mode: records live only in this browser (localStorage) and are not shared across devices. Receipt OCR, cloud storage, login and merged PDF packages need the full Next.js + Supabase build.</p></main>
<script>
const K='wm_v1',P=['Advance','Partial Payment','Final Payment','Refund','Reversal','Adjustment'],M=['UPI','NEFT','RTGS','IMPS','Bank Transfer','Credit Card','Debit Card','Cheque','Cash','Other'],S=['Pending','Successful','Failed','Cancelled','Reversed'];
const seed=()=>({vendors:['Welina Hotels, Bhubaneswar','Transitel Hotel, Kolkata','Car Booking','Catering, Bhubaneswar'].map((n,i)=>({id:'v'+i,name:n,bill:null,due:'',start:'',end:''})),pays:[],log:[]});
let D;try{D=JSON.parse(localStorage.getItem(K))||seed()}catch(e){D=seed()}
const save=()=>{try{localStorage.setItem(K,JSON.stringify(D))}catch(e){}};
const inr=n=>'₹'+Number(n).toLocaleString('en-IN');const $=s=>document.getElementById(s);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function calc(v){const ps=D.pays.filter(p=>p.vid===v.id&&p.status==='Successful');
 const sign=p=>(p.type==='Refund'||p.type==='Reversal')?-1:1;
 const net=ps.reduce((a,p)=>a+sign(p)*p.amt,0),adv=ps.filter(p=>p.type==='Advance').reduce((a,p)=>a+p.amt,0);
 let st,out=null,over=0;
 if(v.bill==null){st='Bill Pending'}else{out=v.bill-net;if(out<0){over=-out;st='Overpaid'}else if(out===0&&v.bill>0)st='Fully Paid';else st=net>0?'Partially Paid':'Unpaid'}
 const pend=D.pays.some(p=>p.vid===v.id&&p.status==='Pending'),noProof=ps.some(p=>!p.proof),noConf=ps.some(p=>!p.conf);
 return{net,adv,out,over,st,pend,noProof,noConf}}
let view='Dashboard',cur=null;
function nav(){$('nav').innerHTML=['Dashboard','Vendors','Record Payment','Ledger','Calendar','Audit'].map(x=>`<button class="${x==view?'on':''}" onclick="go('${x}')">${x}</button>`).join('')+`<button onclick="window.print()">Export PDF</button>`}
function go(x){view=x;nav();render()}
function render(){D.vendors.forEach(()=>0);let h='';
 if(view=='Dashboard'){const c=D.vendors.map(calc),known=D.vendors.filter(v=>v.bill!=null),
  bills=known.reduce((a,v)=>a+v.bill,0),paid=c.reduce((a,x)=>a+x.net,0),out=c.reduce((a,x)=>a+(x.out>0?x.out:0),0);
  const cnt=s=>c.filter(x=>x.st==s).length;
  h=`<div class="g">${[['Confirmed bills',inr(bills)],['Net paid',inr(paid)],['Outstanding',inr(out)],['Vendors',D.vendors.length],['Fully paid',cnt('Fully Paid')],['Partially paid',cnt('Partially Paid')],['Unpaid',cnt('Unpaid')],['Awaiting final bill',cnt('Bill Pending')],['Missing proof',c.filter(x=>x.noProof).length],['Missing vendor confirmation',c.filter(x=>x.noConf).length]].map(([a,b])=>`<div class="card"><div class="l">${a}</div><div class="n">${b}</div></div>`).join('')}</div>${charts(c,bills,paid,out)}<h3>Vendors</h3>`+D.vendors.map(vcard).join('')}
 if(view=='Vendors'){h=D.vendors.map(vcard).join('')+`<form class="card" onsubmit="addV(event)"><b>Add vendor</b><input id="nv" placeholder="Vendor name" required><button class="p">+ Add Vendor</button></form>`}
 if(view=='Vendor'){const v=D.vendors.find(x=>x.id==cur),c=calc(v);h=`<button onclick="go('Vendors')">← Back</button><div class="card"><h2>${esc(v.name)}</h2><span class="t ${tc(c.st)}">${c.st}</span>
 <p>Bill: ${v.bill==null?'not entered':inr(v.bill)} · Advance: ${inr(c.adv)} · Net paid: ${inr(c.net)} · ${c.over?'Excess: '+inr(c.over):c.out==null?'Outstanding: —':'Outstanding: '+inr(c.out)}</p>
 <form onsubmit="setBill(event,'${v.id}')"><label class="l">Confirmed bill amount (₹) — blank means unknown, not ₹0</label><input id="bl" type="number" min="0" step="0.01" value="${v.bill??''}"><label class="l">Payment due</label><input id="du" type="date" value="${v.due}"><label class="l">Service start</label><input id="ss" type="date" value="${v.start}"><label class="l">Service end</label><input id="se" type="date" value="${v.end}"><button class="p">Save</button></form></div><h3>Statement</h3>${table(D.pays.filter(p=>p.vid==v.id))}`}
 if(view=='Record Payment'){h=`<form class="card" onsubmit="addP(event)"><select id="pv">${D.vendors.map(v=>`<option value="${v.id}">${esc(v.name)}</option>`).join('')}</select>
 <input id="pa" type="number" min="0.01" step="0.01" placeholder="Amount ₹" required><label class="l">Payment date (from receipt; never guessed)</label><input id="pd" type="date" required>
 <select id="pt">${P.map(x=>`<option>${x}</option>`)}</select><select id="pm">${M.map(x=>`<option>${x}</option>`)}</select><select id="ps">${S.map(x=>`<option ${x=='Successful'?'selected':''}>${x}</option>`)}</select>
 <input id="pu" placeholder="Transaction ID / UTR"><input id="pn" placeholder="Notes">
 <label class="l">Payment proof (PDF, JPG or PNG, up to 10 MB)</label><input id="pf" type="file" accept=".pdf,.jpg,.jpeg,.png,image/*,application/pdf" multiple><label class="l">Vendor confirmation (PDF, JPG or PNG, up to 10 MB)</label><input id="cf" type="file" accept=".pdf,.jpg,.jpeg,.png,image/*,application/pdf" multiple><label><input type="checkbox" id="pp" style="width:auto"> Payment proof held (without a file)</label><br><label><input type="checkbox" id="pc" style="width:auto"> Vendor confirmation held (without a file)</label><br><button class="p">Save payment</button><p id="msg" class="bad"></p></form>`}
 if(view=='Ledger'){h=`<button onclick="csv()">Export CSV</button><div class="card r">${table(D.pays,1)}</div>`}
 if(view=='Record Payment')h=payForm();
 if(view=='Vendor')h=vendorView();
 if(view=='Calendar')h=cal();
 if(view=='Audit')h=audit();
 $('v').innerHTML=h}
const tc=s=>s=='Fully Paid'?'ok':s=='Overpaid'||s=='Unpaid'?'bad':'w';
function vcard(v){const c=calc(v),pct=v.bill>0?Math.max(0,Math.min(100,c.net/v.bill*100)):0;
 return`<div class="card" onclick="cur='${v.id}';go('Vendor')" style="cursor:pointer"><b>${esc(v.name)}</b> <span class="t ${tc(c.st)}">${c.st}</span><div class="bar"><i style="width:${pct}%"></i></div><div style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px"><div><div class="l">Total bill</div><b>${v.bill==null?'Bill pending':inr(v.bill)}</b></div><div><div class="l">Amount paid</div><b class="ok">${inr(c.net)}</b></div><div><div class="l">Amount due</div><b class="${c.out>0?'bad':''}">${v.bill==null?'—':inr(Math.max(c.out,0))}</b></div></div><div class="l" style="margin-top:6px">${[c.over?'Excess paid '+inr(c.over):'',c.noProof?'proof missing':'',c.noConf?'confirmation missing':''].filter(Boolean).join(' · ')}</div></div>`}
function table(a,all){if(!a.length)return'<p class="l">No transactions yet.</p>';
 return`<div class="r"><table><tr><th>Ref</th><th>Date</th>${all?'<th>Vendor</th>':''}<th>Type</th><th>Amount</th><th>Status</th><th>UTR</th><th>Proof</th><th>Conf.</th><th>Files</th><th></th></tr>${[...a].sort((x,y)=>x.date<y.date?1:-1).map(p=>`<tr><td>${p.ref}</td><td>${p.date}</td>${all?`<td>${esc(D.vendors.find(v=>v.id==p.vid)?.name)}</td>`:''}<td>${p.type}</td><td>${inr(p.amt)}</td><td>${p.status}</td><td>${esc(p.utr)}</td><td>${p.proof?'Yes':'No'}</td><td>${p.conf?'Yes':'No'}</td><td>${(p.files||[]).map(f=>`<button onclick="openF('${f.id}')">${f.kind=='proof'?'Proof':'Conf.'}: ${esc(f.name.slice(0,14))}</button>`).join(' ')} <button onclick="att('${p.ref}','proof')">+Proof</button> <button onclick="att('${p.ref}','conf')">+Conf.</button></td><td>${p.status=='Successful'?`<button onclick="rev('${p.ref}')">Reverse</button>`:''}</td></tr>`).join('')}</table></div>`}
function addV(e){e.preventDefault();const nm=$('nv').value.trim();D.vendors.push({id:'v'+Date.now(),name:nm,bill:null,due:'',start:'',end:''});D.log.push({t:new Date().toISOString(),msg:'Vendor added: '+nm});save();render()}
function setBill(e,id){e.preventDefault();const v=D.vendors.find(x=>x.id==id),b=$('bl').value;D.log.push({t:new Date().toISOString(),v:id,old:v.bill,new:b});
 v.bill=b===''?null:Number(b);v.due=$('du').value;v.start=$('ss').value;v.end=$('se').value;save();render()}
async function addP(e){e.preventDefault();const utr=$('pu').value.trim(),amt=Number($('pa').value),date=$('pd').value,vid=$('pv').value;
 const dup=D.pays.find(p=>(utr&&p.utr&&p.utr.toLowerCase()==utr.toLowerCase())||(p.vid==vid&&p.amt==amt&&p.date==date&&p.status!='Cancelled'&&!utr&&!p.utr));
 if(dup&&!confirm('Possible duplicate of '+dup.ref+'. Save anyway?')){$('msg').textContent='Not saved: possible duplicate of '+dup.ref;return}
 const ref='PAY-'+String(D.pays.length+1).padStart(4,'0');
 const fl=[],bad=[];for(const [id,k] of [['pf','proof'],['cf','conf']])for(const f of $(id).files){if(!okF(f)){bad.push(f.name);continue}fl.push({id:ref+'-'+k+'-'+fl.length,kind:k,name:f.name,type:f.type,f})}
 if(bad.length){$('msg').textContent='Not saved. Only PDF, JPG or PNG up to 10 MB: '+bad.join(', ');return}
 try{for(const x of fl)await putF(x.id,x.f)}catch(err){$('msg').textContent='Could not store files in this browser: '+err.message;return}
 D.pays.push({ref,vid,amt,date,type:$('pt').value,method:$('pm').value,status:$('ps').value,utr,notes:$('pn').value,files:fl.map(({f,...m})=>m),proof:$('pp').checked||fl.some(x=>x.kind=='proof'),conf:$('pc').checked||fl.some(x=>x.kind=='conf')});
 D.log.push({t:new Date().toISOString(),msg:'Payment '+ref+' recorded: '+inr(amt)+' ('+$('pt').value+', '+$('ps').value+')'});save();go('Ledger')}
function rev(ref){if(!confirm('Mark '+ref+' as Reversed? History is kept.'))return;const p=D.pays.find(x=>x.ref==ref);D.log.push({t:new Date().toISOString(),ref,old:p.status,new:'Reversed'});p.status='Reversed';save();render()}
function csv(){const r=[['Ref','Date','Vendor','Type','Method','Amount','Status','UTR','Proof','Confirmation','Notes'],...D.pays.map(p=>[p.ref,p.date,D.vendors.find(v=>v.id==p.vid)?.name,p.type,p.method,p.amt,p.status,p.utr,p.proof,p.conf,p.notes])];
 const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([r.map(x=>x.map(c=>'"'+String(c??'').replace(/"/g,'""')+'"').join(',')).join('\n')],{type:'text/csv'}));a.download='ledger.csv';a.click()}
function charts(c,bills,paid,out){
 const kn=D.vendors.filter(v=>v.bill!=null);const kp=kn.reduce((a,v)=>a+Math.max(0,Math.min(v.bill,calc(v).net)),0),ko=kn.reduce((a,v)=>a+Math.max(0,calc(v).out),0),tot=kp+ko,R=40,C=2*Math.PI*R;
 const dn=tot?`<svg viewBox="0 0 100 100" width="140" role="img" aria-label="Paid versus outstanding"><circle cx="50" cy="50" r="${R}" fill="none" stroke="var(--red)" stroke-width="14"/><circle cx="50" cy="50" r="${R}" fill="none" stroke="var(--sage)" stroke-width="14" stroke-dasharray="${C*kp/tot} ${C}" transform="rotate(-90 50 50)" style="transition:stroke-dasharray .6s"/><text x="50" y="54" text-anchor="middle" font-size="13" fill="currentColor">${Math.round(kp/tot*100)}%</text></svg>`:'<p class="l">Enter a confirmed bill to see the chart.</p>';
 const mx=Math.max(1,...kn.map(v=>v.bill));
 const bars=kn.map(v=>{const x=calc(v);return`<div style="margin:8px 0"><div class="l">${esc(v.name)} — bill ${inr(v.bill)}</div><div class="bar"><i style="width:${v.bill/mx*100}%;background:var(--gold)"></i></div><div class="bar" style="margin-top:3px"><i style="width:${Math.max(0,x.net)/mx*100}%"></i></div><div class="l">paid ${inr(x.net)} · balance ${inr(Math.max(0,x.out))}</div></div>`}).join('');
 return`<div class="g"><div class="card"><b>Paid vs outstanding</b> <span class="l">(known bills)</span><br>${dn}<div class="l"><span class="ok">■</span> paid ${inr(kp)} · <span class="bad">■</span> outstanding ${inr(ko)}</div></div><div class="card" style="grid-column:span 2"><b>By vendor</b> <span class="l">gold = bill, green = paid</span>${bars||'<p class="l">No confirmed bills yet.</p>'}</div></div>`}
function cal(){
 const ev=[];D.vendors.forEach(v=>{if(v.start)ev.push({d:v.start,t:'Service starts',v});if(v.end)ev.push({d:v.end,t:'Service ends',v});if(v.due){const late=calc(v).st!='Fully Paid'&&v.due<new Date().toISOString().slice(0,10);ev.push({d:v.due,t:'Payment due',v,late,before:v.start&&v.due<=v.start})}});
 ev.sort((a,b)=>a.d<b.d?-1:1);
 const miss=D.vendors.filter(v=>!v.start||!v.end);
 return`<div class="card"><b>Services & payment deadlines</b>${ev.length?`<div class="r"><table><tr><th>Date</th><th>Vendor</th><th>Event</th><th></th></tr>${ev.map(e=>`<tr><td>${e.d}</td><td>${esc(e.v.name)}</td><td>${e.t}</td><td>${e.late?'<span class="t bad">Overdue</span>':e.before?'<span class="t w">Due before service</span>':''}</td></tr>`).join('')}</table></div>`:'<p class="l">No dates yet. Open a vendor to add service and due dates.</p>'}</div>${miss.length?`<div class="card"><b>Service dates pending</b><div class="l">${miss.map(v=>esc(v.name)).join(' · ')}</div></div>`:''}`}
function audit(){
 const L=[...D.log].reverse();return`<div class="card r"><b>Audit history</b>${L.length?`<table><tr><th>When</th><th>Change</th></tr>${L.map(l=>{const w=new Date(l.t).toLocaleString('en-IN');const vn=l.v?D.vendors.find(x=>x.id==l.v)?.name:'';return`<tr><td>${w}</td><td>${esc(l.msg||(l.ref?l.ref+' status: ':vn+' bill: ')+(l.old??'blank')+' → '+(l.new===''?'blank':l.new))}</td></tr>`}).join('')}</table>`:'<p class="l">No changes recorded yet.</p>'}</div>`}
const okF=f=>/\.(pdf|jpe?g|png)$/i.test(f.name)&&['application/pdf','image/jpeg','image/png'].includes(f.type)&&f.size<=10485760;
const db=()=>new Promise((ok,no)=>{const r=indexedDB.open('wm_files',1);r.onupgradeneeded=()=>r.result.createObjectStore('f');r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)});
const putF=async(id,b)=>{const d=await db();return new Promise((ok,no)=>{const t=d.transaction('f','readwrite');t.objectStore('f').put(b,id);t.oncomplete=ok;t.onerror=()=>no(t.error)})};
const getF=async id=>{const d=await db();return new Promise((ok,no)=>{const r=d.transaction('f').objectStore('f').get(id);r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)})};
async function openF(id){let m;D.pays.forEach(p=>(p.files||[]).forEach(f=>{if(f.id==id)m=f}));
 try{const b=await getF(id);if(!b)throw 0;const u=URL.createObjectURL(b),o=document.createElement('div');o.style.cssText='position:fixed;inset:0;background:#000c;z-index:9;display:flex;flex-direction:column;padding:12px;gap:8px;color:#fff';
 o.innerHTML=`<div>${esc(m.name)} <a href="${u}" download="${esc(m.name)}" style="color:#fff">Download</a> <button id="xc">Close</button></div>`+(m.type=='application/pdf'?`<iframe src="${u}" style="flex:1;background:#fff;border:0"></iframe>`:`<img src="${u}" style="flex:1;object-fit:contain;min-height:0">`);
 document.body.appendChild(o);o.querySelector('#xc').onclick=()=>{o.remove();URL.revokeObjectURL(u)}}catch(e){alert('This file is not in this browser\'s storage.')}}
function att(ref,k){const i=document.createElement('input');i.type='file';i.accept='.pdf,.jpg,.jpeg,.png,image/*,application/pdf';i.multiple=true;
 i.onchange=async()=>{const p=D.pays.find(x=>x.ref==ref),bad=[];for(const f of i.files){if(!okF(f)){bad.push(f.name);continue}const id=ref+'-'+k+'-'+Date.now()+Math.random().toString(36).slice(2,5);try{await putF(id,f)}catch(e){bad.push(f.name);continue}(p.files=p.files||[]).push({id,kind:k,name:f.name,type:f.type});p[k]=true;D.log.push({t:new Date().toISOString(),msg:ref+': '+(k=='proof'?'payment proof':'vendor confirmation')+' attached ('+f.name+')'})}
 save();render();if(bad.length)alert('Not attached (PDF, JPG or PNG up to 10 MB only): '+bad.join(', '))};i.click()}
const figs=(v,c)=>{const f=(a,b,k)=>`<div><div class="l">${a}</div><b class="${k||''}">${b}</b></div>`;return`<div class="g" style="grid-template-columns:repeat(auto-fit,minmax(110px,1fr))">${f('Total bill',v.bill==null?'Bill pending':inr(v.bill))}${f('Advance paid',inr(c.adv),'ok')}${f('Total paid',inr(c.net),'ok')}${f('Amount due',v.bill==null?'\u2014':inr(Math.max(c.out,0)),c.out>0?'bad':'')}</div>`};
function vcard(v){const c=calc(v),pct=v.bill>0?Math.max(0,Math.min(100,c.net/v.bill*100)):0;
 return`<div class="card" onclick="cur='${v.id}';go('Vendor')" style="cursor:pointer"><b>${esc(v.name)}</b> <span class="t ${tc(c.st)}">${c.st}</span><div class="bar" style="margin:8px 0 10px"><i style="width:${pct}%"></i></div>${figs(v,c)}<div class="l" style="margin-top:6px">${[c.over?'Excess paid '+inr(c.over):'',c.noProof?'receipt missing':'',c.noConf?'confirmation missing':''].filter(Boolean).join(' \u00b7 ')}</div></div>`}
function vendorView(){const v=D.vendors.find(x=>x.id==cur),c=calc(v);
 return`<button onclick="go('Vendors')">\u2190 Back</button><div class="card"><h2>${esc(v.name)}</h2><span class="t ${tc(c.st)}">${c.st}</span><div style="margin:12px 0">${figs(v,c)}</div><form onsubmit="setBill(event,'${v.id}')"><label class="l">Confirmed bill amount (\u20b9) \u2014 blank means unknown, not \u20b90</label><input id="bl" type="number" min="0" step="0.01" value="${v.bill??''}"><label class="l">Service start</label><input id="ss" type="date" value="${v.start}"><label class="l">Service end</label><input id="se" type="date" value="${v.end}"><button class="p">Save</button></form></div><h3>Payments</h3>${table(D.pays.filter(p=>p.vid==v.id))}`}
function setBill(e,id){e.preventDefault();const v=D.vendors.find(x=>x.id==id),b=$('bl').value;D.log.push({t:new Date().toISOString(),v:id,old:v.bill,new:b});v.bill=b===''?null:Number(b);v.start=$('ss').value;v.end=$('se').value;save();render()}
function payForm(){setTimeout(pv,0);const o=a=>a.map(x=>`<option>${x}</option>`).join('');
 return`<form class="card" onsubmit="addP(event)"><h3 style="margin:0 0 6px">Record a payment</h3><label class="l">Paying to (existing vendor)</label><select id="pv" onchange="pv()">${D.vendors.map(v=>`<option value="${v.id}">${esc(v.name)}</option>`).join('')}</select><div id="sum" class="card"></div><label class="l">Amount (\u20b9)</label><input id="pa" type="number" min="0.01" step="0.01" required oninput="pv()"><label class="l">Payment date (as on the receipt)</label><input id="pd" type="date" required><label class="l">Type</label><select id="pt" onchange="pv()">${o(P)}</select><label class="l">Method</label><select id="pm">${o(M)}</select><label class="l">Status</label><select id="ps" onchange="pv()">${S.map(x=>`<option ${x=='Successful'?'selected':''}>${x}</option>`).join('')}</select><input id="pu" placeholder="Transaction ID / UTR"><input id="pn" placeholder="Notes"><label class="l">Payment receipt link (Google Drive)</label><input id="rl" type="url" placeholder="https://drive.google.com/..."><label class="l">Vendor confirmation link (Google Drive)</label><input id="cl" type="url" placeholder="https://drive.google.com/..."><button class="p">Save payment</button><p id="msg" class="bad"></p></form>`}
function pv(){const s=$('sum');if(!s||!$('pv'))return;const v=D.vendors.find(x=>x.id==$('pv').value);if(!v)return;const c=calc(v),a=Number($('pa').value)||0,t=$('pt').value,st=$('ps').value,eff=st==='Successful'?((t==='Refund'||t==='Reversal')?-a:a):0,after=c.net+eff;
 s.innerHTML=`<div class="g" style="grid-template-columns:repeat(auto-fit,minmax(120px,1fr))"><div><div class="l">Total bill</div><b>${v.bill==null?'Bill pending':inr(v.bill)}</b></div><div><div class="l">Paid so far</div><b>${inr(c.net)}</b></div><div><div class="l">This payment</div><b>${a?inr(a):'\u2014'}</b>${a&&!eff?`<div class="l">not counted (${st})</div>`:''}</div><div><div class="l">Amount due after</div><b class="${v.bill!=null&&v.bill-after<0?'bad':'ok'}">${v.bill==null?'\u2014':v.bill-after<0?'Overpaid by '+inr(after-v.bill):inr(v.bill-after)}</b></div></div>`}
function addP(e){e.preventDefault();const utr=$('pu').value.trim(),amt=Number($('pa').value),date=$('pd').value,vid=$('pv').value,rl=$('rl').value.trim(),cl=$('cl').value.trim();
 if([rl,cl].some(u=>u&&!/^https?:\/\//i.test(u))){$('msg').textContent='Links must start with https://';return}
 const dup=D.pays.find(p=>(utr&&p.utr&&p.utr.toLowerCase()==utr.toLowerCase())||(p.vid==vid&&p.amt==amt&&p.date==date&&p.status!='Cancelled'&&!utr&&!p.utr));
 if(dup&&!confirm('Possible duplicate of '+dup.ref+'. Save anyway?')){$('msg').textContent='Not saved: possible duplicate of '+dup.ref;return}
 const ref='PAY-'+String(D.pays.length+1).padStart(4,'0');
 D.pays.push({ref,vid,amt,date,type:$('pt').value,method:$('pm').value,status:$('ps').value,utr,notes:$('pn').value,rl,cl,proof:!!rl,conf:!!cl});
 D.log.push({t:new Date().toISOString(),msg:'Payment '+ref+' recorded: '+inr(amt)+' ('+$('pt').value+', '+$('ps').value+')'});save();go('Ledger')}
function lnk(ref,k){const u=(prompt('Paste the Google Drive link')||'').trim();if(!u)return;if(!/^https?:\/\//i.test(u)){alert('Link must start with https://');return}const p=D.pays.find(x=>x.ref==ref);p[k]=u;if(k=='rl')p.proof=true;else p.conf=true;D.log.push({t:new Date().toISOString(),msg:ref+': '+(k=='rl'?'receipt':'vendor confirmation')+' link added'});save();render()}
function table(a){if(!a.length)return'<p class="l">No payments recorded yet.</p>';
 const after={};D.vendors.forEach(v=>{let run=0;D.pays.filter(p=>p.vid===v.id).sort((x,y)=>x.date<y.date?-1:x.date>y.date?1:(x.ref<y.ref?-1:1)).forEach(p=>{if(p.status==='Successful')run+=(p.type==='Refund'||p.type==='Reversal'?-1:1)*p.amt;after[p.ref]=v.bill==null?null:v.bill-run})});
 return[...a].sort((x,y)=>x.date<y.date?1:x.date>y.date?-1:(x.ref<y.ref?1:-1)).map(p=>{const v=D.vendors.find(x=>x.id==p.vid),sc=p.status==='Successful'?'ok':p.status==='Pending'?'w':'bad',d=after[p.ref];
 return`<div class="card pay"><div class="top"><div><b>${esc(v?.name)}</b><div class="l">${p.date} \u00b7 ${p.ref} \u00b7 ${p.type} \u00b7 ${p.method}</div></div><div style="text-align:right"><div class="n">${inr(p.amt)}</div><span class="t ${sc}">${p.status}</span></div></div><div class="l" style="margin-top:6px">${p.utr?'UTR '+esc(p.utr)+' \u00b7 ':''}Amount due after: ${d==null?'\u2014':d<0?'Overpaid '+inr(-d):inr(d)}${p.notes?' \u00b7 '+esc(p.notes):''}</div><div class="acts">${p.rl?`<a href="${esc(p.rl)}" target="_blank" rel="noopener noreferrer">Receipt \u2197</a>`:`<button onclick="lnk('${p.ref}','rl')">+ Receipt link</button>`}${p.cl?`<a href="${esc(p.cl)}" target="_blank" rel="noopener noreferrer">Confirmation \u2197</a>`:`<button onclick="lnk('${p.ref}','cl')">+ Confirmation link</button>`}${p.status==='Successful'?`<button onclick="rev('${p.ref}')">Reverse</button>`:''}</div></div>`}).join('')}
nav();render();
</script></body></html>
